# Environnement de developpement avec rechargement a chaud.
#   docker compose -f docker-compose.dev.yml up              # base, services Java, gateway, novaui
#   docker compose -f docker-compose.dev.yml --profile ai --profile voice up   # + assistant IA et voix
# Le code source est monte dans les conteneurs : modifier un fichier suffit.
#   Java    : recompilation automatique puis redemarrage par spring-boot-devtools (docker/dev-java.sh)
#   Python  : uvicorn --reload
#   NovaUI  : Vite (HMR)
name: erp-dev

x-java: &java
  image: maven:3.9-eclipse-temurin-17
  working_dir: /app
  command: ["sh", "/dev-java.sh"]
  restart: unless-stopped
  environment: &java-env
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .reload-trigger

services:
  erp-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: erp
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_svc}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:-stock_svc}
      VENTE_DB_PASSWORD: ${VENTE_DB_PASSWORD:-vente_svc}
      RH_DB_PASSWORD: ${RH_DB_PASSWORD:-rh_svc}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:-crm_svc}
      MODULE_DB_PASSWORD: ${MODULE_DB_PASSWORD:-module_svc}
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    <<: *java
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=auth
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_svc}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    volumes:
      - ./services/auth-service:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      erp-db:
        condition: service_healthy
  stock-service:
    <<: *java
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=stock
      DB_USER: stock_svc
      DB_PASSWORD: ${STOCK_DB_PASSWORD:-stock_svc}
    volumes:
      - ./services/stock-service:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      erp-db:
        condition: service_healthy
  vente-service:
    <<: *java
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=vente
      DB_USER: vente_svc
      DB_PASSWORD: ${VENTE_DB_PASSWORD:-vente_svc}
      STOCK_URL: http://stock-service:8083
    volumes:
      - ./services/vente-service:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      erp-db:
        condition: service_healthy
  rh-service:
    <<: *java
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=rh
      DB_USER: rh_svc
      DB_PASSWORD: ${RH_DB_PASSWORD:-rh_svc}
    volumes:
      - ./services/rh-service:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      erp-db:
        condition: service_healthy
  crm-service:
    <<: *java
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=crm
      DB_USER: crm_svc
      DB_PASSWORD: ${CRM_DB_PASSWORD:-crm_svc}
      VENTE_URL: http://vente-service:8082
      STOCK_URL: http://stock-service:8083
    volumes:
      - ./services/crm-service:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      erp-db:
        condition: service_healthy
  module-service:
    <<: *java
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=module
      DB_USER: module_svc
      DB_PASSWORD: ${MODULE_DB_PASSWORD:-module_svc}
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      STOCK_URL: http://stock-service:8083
    volumes:
      - ./services/module-service:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      erp-db:
        condition: service_healthy
  gateway:
    <<: *java
    environment:
      <<: *java-env
      AUTH_URL: http://auth-service:8084
      STOCK_URL: http://stock-service:8083
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      CRM_URL: http://crm-service:8085
      AI_URL: http://ai-service:8086
      VOICE_URL: http://voice-service:8087
      MODULE_URL: http://module-service:8088
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - /app/target
      - ./docker/dev-java.sh:/dev-java.sh:ro
      - m2-cache:/root/.m2
    depends_on:
      - auth-service
      - stock-service
      - vente-service
      - rh-service
      - crm-service
      - module-service

  # Assistant IA (profil "ai") : cle Gemini dans un fichier .env a la racine (jamais commite).
  ai-service:
    profiles: ["ai"]
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8086 --reload"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ERP_GATEWAY_URL: http://gateway:8080
    volumes:
      - ./services/ai-service:/app
      - pip-cache:/root/.cache/pip

  # Transcription vocale (profil "voice") : le premier demarrage telecharge le modele Whisper.
  voice-service:
    profiles: ["voice"]
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8087 --reload"
    environment:
      VOICE_MODEL_SIZE: ${VOICE_MODEL_SIZE:-small}
      VOICE_DEVICE: ${VOICE_DEVICE:-cpu}
      VOICE_COMPUTE_TYPE: ${VOICE_COMPUTE_TYPE:-int8}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-fr}
    volumes:
      - ./services/voice-service:/app
      - pip-cache:/root/.cache/pip
      - hf-cache:/root/.cache/huggingface

  # Front web NovaUI (Vite, rechargement a chaud)
  novaui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://gateway:8080}
    volumes:
      - ./novaui:/app
      - novaui-node-modules:/app/node_modules

volumes:
  erp-data:
  m2-cache:
  pip-cache:
  hf-cache:
  novaui-node-modules:
