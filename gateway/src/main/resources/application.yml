server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            exposedHeaders: X-Total-Count
            maxAge: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_URL:http://localhost:8084}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: crm-service
          uri: ${CRM_URL:http://localhost:8085}
          predicates:
            - Path=/api/crm/**
          filters:
            - StripPrefix=2
        - id: rh-service
          uri: ${RH_URL:http://localhost:8081}
          predicates:
            - Path=/api/rh/**
          filters:
            - StripPrefix=2
        - id: vente-service
          uri: ${VENTE_URL:http://localhost:8082}
          predicates:
            - Path=/api/vente/**
          filters:
            - StripPrefix=2
        - id: stock-service
          uri: ${STOCK_URL:http://localhost:8083}
          predicates:
            - Path=/api/stock/**
          filters:
            - StripPrefix=2
        - id: ai-service
          uri: ${AI_URL:http://localhost:8086}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
        - id: voice-service
          uri: ${VOICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/voice/**
          filters:
            - StripPrefix=2
        - id: module-service
          uri: ${MODULE_URL:http://localhost:8088}
          predicates:
            - Path=/api/modules/**
          filters:
            - StripPrefix=2
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: Stock
    urls:
      - name: Auth
        url: /api/auth/v3/api-docs
      - name: Stock
        url: /api/stock/v3/api-docs
      - name: Vente
        url: /api/vente/v3/api-docs
      - name: RH
        url: /api/rh/v3/api-docs
      - name: CRM
        url: /api/crm/v3/api-docs
      - name: AI
        url: /api/ai/v3/api-docs
      - name: Modules
        url: /api/modules/v3/api-docs
