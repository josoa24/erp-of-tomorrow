# Une seule instance PostgreSQL pour tout l'ERP : un schéma et un utilisateur par microservice
# (créés par docker/postgres/init/01-schemas.sh). Chaque service ne voit que son schéma.
x-service: &service
  restart: unless-stopped
  environment: &service-env
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  deploy:
    resources:
      limits:
        memory: ${JAVA_SERVICE_MEMORY:-512m}

x-db-service: &db-service
  <<: *service
  depends_on:
    erp-db:
      condition: service_healthy

services:
  erp-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: erp
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_svc}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:-stock_svc}
      VENTE_DB_PASSWORD: ${VENTE_DB_PASSWORD:-vente_svc}
      RH_DB_PASSWORD: ${RH_DB_PASSWORD:-rh_svc}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:-crm_svc}
    # 5 services x 5 connexions au plus, plus l'administration : 60 suffisent.
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512m

  auth-service:
    <<: *db-service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/auth-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=auth
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_svc}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
  stock-service:
    <<: *db-service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/stock-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=stock
      DB_USER: stock_svc
      DB_PASSWORD: ${STOCK_DB_PASSWORD:-stock_svc}
  vente-service:
    <<: *db-service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/vente-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=vente
      DB_USER: vente_svc
      DB_PASSWORD: ${VENTE_DB_PASSWORD:-vente_svc}
      STOCK_URL: http://stock-service:8083
  rh-service:
    <<: *db-service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/rh-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=rh
      DB_USER: rh_svc
      DB_PASSWORD: ${RH_DB_PASSWORD:-rh_svc}
  crm-service:
    <<: *db-service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/crm-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=crm
      DB_USER: crm_svc
      DB_PASSWORD: ${CRM_DB_PASSWORD:-crm_svc}
      VENTE_URL: http://vente-service:8082
      STOCK_URL: http://stock-service:8083
  gateway:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: gateway
    environment:
      <<: *service-env
      AUTH_URL: http://auth-service:8084
      STOCK_URL: http://stock-service:8083
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      CRM_URL: http://crm-service:8085
      AI_URL: ${AI_URL:-http://ai-service:8086}
      VOICE_URL: ${VOICE_URL:-http://voice-service:8087}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - stock-service
      - vente-service
      - rh-service
      - crm-service

  # Assistant IA : démarré seulement avec le profil "ai" (docker compose --profile ai up -d --build).
  # Il joint la gateway par le port publié sur la machine (host.docker.internal).
  ai-service:
    profiles: ["ai"]
    build: ./services/ai-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ERP_GATEWAY_URL: ${ERP_GATEWAY_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256m

  # Transcription vocale (profil "voice") : docker compose --profile voice up -d --build.
  # Le premier démarrage télécharge le modèle Whisper (VOICE_MODEL_SIZE), conservé dans le volume hf-cache.
  voice-service:
    profiles: ["voice"]
    build: ./services/voice-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      VOICE_MODEL_SIZE: ${VOICE_MODEL_SIZE:-small}
      VOICE_DEVICE: ${VOICE_DEVICE:-cpu}
      VOICE_COMPUTE_TYPE: ${VOICE_COMPUTE_TYPE:-int8}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-fr}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: ${VOICE_SERVICE_MEMORY:-1536m}

volumes:
  erp-data:
  hf-cache:
