services:
  rh-db:
    image: postgres:16
    environment:
      POSTGRES_DB: rh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5431:5432"
    volumes:
      - rh-data:/var/lib/postgresql/data
  vente-db:
    image: postgres:16
    environment:
      POSTGRES_DB: vente_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vente-data:/var/lib/postgresql/data
  stock-db:
    image: postgres:16
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - stock-data:/var/lib/postgresql/data
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
  crm-db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - crm-data:/var/lib/postgresql/data
  # Assistant IA : démarré seulement avec le profil "ai" (docker compose --profile ai up -d --build).
  # Les services Java tournent sur la machine hôte : l'IA joint la gateway via host.docker.internal.
  ai-service:
    profiles: ["ai"]
    build: ./services/ai-service
    ports:
      - "8086:8086"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ERP_GATEWAY_URL: ${ERP_GATEWAY_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  crm-data:
  auth-data:
  rh-data:
  vente-data:
  stock-data:
