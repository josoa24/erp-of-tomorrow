# Production (Dokploy, type « Docker Compose », fichier docker-compose.yml).
#
# Aucun port n'est publié sur la machine : les services se parlent sur le réseau interne du projet.
# Le seul point d'entrée est le service « novaui » (nginx, port interne 8080) : dans Dokploy, onglet
# Domains, ajouter le domaine avec Service Name = novaui, Port = 8080, HTTPS activé. Il sert le front
# et relaie /api/ vers la gateway (même origine : pas de CORS, pas de port à ouvrir).
# La base, les services Java, la gateway, l'assistant IA et la voix ne sont joignables que par ce réseau.
#
# Les variables sont à définir dans Dokploy (onglet Environment). Celles marquées « obligatoire » font échouer
# le déploiement si elles manquent : aucune valeur de développement n'est utilisée en production.
#
# Ordre de démarrage : erp-db -> services (Hibernate crée les tables) -> migrate (migrations SQL idempotentes,
# rejouées à chaque déploiement, avec nouvel essai tant que les tables n'existent pas) ; gateway -> novaui.

x-service: &service
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: ${JAVA_SERVICE_MEMORY:-512m}

x-java-build: &java-build
  context: .
  dockerfile: docker/Dockerfile.java

x-after-db: &after-db
  depends_on:
    erp-db:
      condition: service_healthy

x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatoire (32 caractères minimum, identique pour la gateway et l'auth)}

services:
  erp-db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      POSTGRES_DB: erp
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD obligatoire}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:?STOCK_DB_PASSWORD obligatoire}
      VENTE_DB_PASSWORD: ${VENTE_DB_PASSWORD:?VENTE_DB_PASSWORD obligatoire}
      RH_DB_PASSWORD: ${RH_DB_PASSWORD:?RH_DB_PASSWORD obligatoire}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?CRM_DB_PASSWORD obligatoire}
      MODULE_DB_PASSWORD: ${MODULE_DB_PASSWORD:?MODULE_DB_PASSWORD obligatoire}
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - erp-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m

  migrate:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile.migrate
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      POSTGRES_DB: erp
      MODULE_DB_PASSWORD: ${MODULE_DB_PASSWORD:?MODULE_DB_PASSWORD obligatoire}
    depends_on:
      erp-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      stock-service:
        condition: service_started
      vente-service:
        condition: service_started
      rh-service:
        condition: service_started
      crm-service:
        condition: service_started
      module-service:
        condition: service_started

  auth-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/auth-service
    environment:
      <<: *secrets
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=auth
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL obligatoire}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD obligatoire}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    expose:
      - "8084"

  stock-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/stock-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=stock
      DB_USER: stock_svc
      DB_PASSWORD: ${STOCK_DB_PASSWORD}
    expose:
      - "8083"

  vente-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/vente-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=vente
      DB_USER: vente_svc
      DB_PASSWORD: ${VENTE_DB_PASSWORD}
      STOCK_URL: http://stock-service:8083
    expose:
      - "8082"

  rh-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/rh-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=rh
      DB_USER: rh_svc
      DB_PASSWORD: ${RH_DB_PASSWORD}
    expose:
      - "8081"

  crm-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/crm-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=crm
      DB_USER: crm_svc
      DB_PASSWORD: ${CRM_DB_PASSWORD}
      VENTE_URL: http://vente-service:8082
      STOCK_URL: http://stock-service:8083
    expose:
      - "8085"

  module-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/module-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=module
      DB_USER: module_svc
      DB_PASSWORD: ${MODULE_DB_PASSWORD}
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      STOCK_URL: http://stock-service:8083
    expose:
      - "8088"

  gateway:
    <<: *service
    build:
      <<: *java-build
      args:
        MODULE_PATH: gateway
    environment:
      <<: *secrets
      AUTH_URL: http://auth-service:8084
      STOCK_URL: http://stock-service:8083
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      CRM_URL: http://crm-service:8085
      MODULE_URL: http://module-service:8088
      AI_URL: http://ai-service:8086
      VOICE_URL: http://voice-service:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
    expose:
      - "8080"
    depends_on:
      - auth-service
      - stock-service
      - vente-service
      - rh-service
      - crm-service
      - module-service
      - ai-service

  ai-service:
    build: ./services/ai-service
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ERP_GATEWAY_URL: http://gateway:8080
    volumes:
      - ai-data:/app/data
    expose:
      - "8086"
    deploy:
      resources:
        limits:
          memory: 512m

  voice-service:
    profiles: ["voice"]
    build: ./services/voice-service
    restart: unless-stopped
    environment:
      VOICE_MODEL_SIZE: ${VOICE_MODEL_SIZE:-small}
      VOICE_DEVICE: ${VOICE_DEVICE:-cpu}
      VOICE_COMPUTE_TYPE: ${VOICE_COMPUTE_TYPE:-int8}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-fr}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    expose:
      - "8087"
    deploy:
      resources:
        limits:
          memory: ${VOICE_SERVICE_MEMORY:-1536m}

  novaui:
    build:
      context: ./novaui
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  erp-data:
  ai-data:
  hf-cache:
