x-db: &db
  image: postgres:16
  environment: &db-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 10

x-service: &service
  restart: unless-stopped
  environment: &service-env
    DB_USER: postgres
    DB_PASSWORD: postgres
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}

services:
  rh-db:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: rh_db
    ports:
      - "5431:5432"
    volumes:
      - rh-data:/var/lib/postgresql/data
  vente-db:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: vente_db
    ports:
      - "5432:5432"
    volumes:
      - vente-data:/var/lib/postgresql/data
  stock-db:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: stock_db
    ports:
      - "5433:5432"
    volumes:
      - stock-data:/var/lib/postgresql/data
  auth-db:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: auth_db
    ports:
      - "5434:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
  crm-db:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: crm_db
    ports:
      - "5435:5432"
    volumes:
      - crm-data:/var/lib/postgresql/data

  auth-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/auth-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    depends_on:
      auth-db:
        condition: service_healthy
  stock-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/stock-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://stock-db:5432/stock_db
    depends_on:
      stock-db:
        condition: service_healthy
  vente-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/vente-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://vente-db:5432/vente_db
      STOCK_URL: http://stock-service:8083
    depends_on:
      vente-db:
        condition: service_healthy
  rh-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/rh-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://rh-db:5432/rh_db
    depends_on:
      rh-db:
        condition: service_healthy
  crm-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: services/crm-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://crm-db:5432/crm_db
      VENTE_URL: http://vente-service:8082
      STOCK_URL: http://stock-service:8083
    depends_on:
      crm-db:
        condition: service_healthy
  gateway:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE_PATH: gateway
    environment:
      <<: *service-env
      AUTH_URL: http://auth-service:8084
      STOCK_URL: http://stock-service:8083
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      CRM_URL: http://crm-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - stock-service
      - vente-service
      - rh-service
      - crm-service


  # Assistant IA : démarré seulement avec le profil "ai" (docker compose --profile ai up -d --build).
  # Les services Java tournent sur la machine hôte : l'IA joint la gateway via host.docker.internal.
  ai-service:
    profiles: ["ai"]
    build: ./services/ai-service
    ports:
      - "8086:8086"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ERP_GATEWAY_URL: ${ERP_GATEWAY_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Front web NovaUI en mode développement (rechargement à chaud) : docker compose up novaui
  novaui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://gateway:8080}
    volumes:
      - ./novaui:/app
      - novaui-node-modules:/app/node_modules
volumes:
  novaui-node-modules:
  crm-data:
  auth-data:
  rh-data:
  vente-data:
  stock-data:
