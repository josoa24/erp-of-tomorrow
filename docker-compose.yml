x-service: &service
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: ${JAVA_SERVICE_MEMORY:-384m}
        cpus: ${JAVA_SERVICE_CPUS:-1.0}

x-java-build: &java-build
  context: .
  dockerfile: docker/Dockerfile.java

x-after-db: &after-db
  depends_on:
    erp-db:
      condition: service_healthy

x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatoire (32 caractères minimum, identique pour la gateway et l'auth)}

services:
  erp-db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      POSTGRES_DB: erp
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD obligatoire}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:?STOCK_DB_PASSWORD obligatoire}
      VENTE_DB_PASSWORD: ${VENTE_DB_PASSWORD:?VENTE_DB_PASSWORD obligatoire}
      RH_DB_PASSWORD: ${RH_DB_PASSWORD:?RH_DB_PASSWORD obligatoire}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?CRM_DB_PASSWORD obligatoire}
      MODULE_DB_PASSWORD: ${MODULE_DB_PASSWORD:?MODULE_DB_PASSWORD obligatoire}
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - erp-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "1.0"

  migrate:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile.migrate
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      POSTGRES_DB: erp
      MODULE_DB_PASSWORD: ${MODULE_DB_PASSWORD:?MODULE_DB_PASSWORD obligatoire}
    depends_on:
      erp-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      vente-service:
        condition: service_healthy
      rh-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      module-service:
        condition: service_healthy

  auth-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/auth-service
    environment:
      <<: *secrets
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=auth
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL obligatoire}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD obligatoire}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 90s

  stock-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/stock-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=stock
      DB_USER: stock_svc
      DB_PASSWORD: ${STOCK_DB_PASSWORD}
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 90s

  vente-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/vente-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=vente
      DB_USER: vente_svc
      DB_PASSWORD: ${VENTE_DB_PASSWORD}
      STOCK_URL: http://stock-service:8083
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 90s
    depends_on:
      erp-db:
        condition: service_healthy
      stock-service:
        condition: service_healthy

  rh-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/rh-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=rh
      DB_USER: rh_svc
      DB_PASSWORD: ${RH_DB_PASSWORD}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 90s
    depends_on:
      erp-db:
        condition: service_healthy
      stock-service:
        condition: service_healthy

  crm-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/crm-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=crm
      DB_USER: crm_svc
      DB_PASSWORD: ${CRM_DB_PASSWORD}
      VENTE_URL: http://vente-service:8082
      STOCK_URL: http://stock-service:8083
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 90s
    depends_on:
      erp-db:
        condition: service_healthy
      vente-service:
        condition: service_healthy

  module-service:
    <<: [*service, *after-db]
    build:
      <<: *java-build
      args:
        MODULE_PATH: services/module-service
    environment:
      DB_URL: jdbc:postgresql://erp-db:5432/erp?currentSchema=module
      DB_USER: module_svc
      DB_PASSWORD: ${MODULE_DB_PASSWORD}
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      STOCK_URL: http://stock-service:8083
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 90s
    depends_on:
      erp-db:
        condition: service_healthy
      rh-service:
        condition: service_healthy

  gateway:
    <<: *service
    build:
      <<: *java-build
      args:
        MODULE_PATH: gateway
    environment:
      <<: *secrets
      AUTH_URL: http://auth-service:8084
      STOCK_URL: http://stock-service:8083
      VENTE_URL: http://vente-service:8082
      RH_URL: http://rh-service:8081
      CRM_URL: http://crm-service:8085
      MODULE_URL: http://module-service:8088
      AI_URL: http://ai-service:8086
      VOICE_URL: http://voice-service:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
    expose:
      - "8080"
    depends_on:
      auth-service:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      vente-service:
        condition: service_healthy
      rh-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      module-service:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build: ./services/ai-service
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ERP_GATEWAY_URL: http://gateway:8080
    volumes:
      - ai-data:/app/data
    expose:
      - "8086"
    deploy:
      resources:
        limits:
          memory: 512m

  voice-service:
    profiles: ["voice"]
    build: ./services/voice-service
    restart: unless-stopped
    environment:
      VOICE_MODEL_SIZE: ${VOICE_MODEL_SIZE:-small}
      VOICE_PARTIAL_MODEL_SIZE: ${VOICE_PARTIAL_MODEL_SIZE:-tiny}
      VOICE_DEVICE: ${VOICE_DEVICE:-cpu}
      VOICE_COMPUTE_TYPE: ${VOICE_COMPUTE_TYPE:-int8}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-fr}
      OMP_NUM_THREADS: ${VOICE_CPU_THREADS:-2}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    expose:
      - "8087"
    deploy:
      resources:
        limits:
          memory: ${VOICE_SERVICE_MEMORY:-1536m}

  novaui:
    build:
      context: ./novaui
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  erp-data:
  ai-data:
  hf-cache:
