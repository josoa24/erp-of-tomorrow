server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 2
  port: 8081
spring:
  application:
    name: rh-service
  datasource:
    # Base unique de l'ERP, schéma et utilisateur propres à ce service (voir docker/postgres/init).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp?currentSchema=rh}
    username: ${DB_USER:rh_svc}
    password: ${DB_PASSWORD:rh_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:rh}
        hbm2ddl:
          create_namespaces: true
app:
  zone: ${APP_ZONE:Indian/Antananarivo}
management:
  endpoints:
    web:
      exposure:
        include: health,info
