server:
  port: 8081
spring:
  application:
    name: rh-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/rh_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
