server:
  port: 8082
spring:
  application:
    name: vente-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vente_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
stock:
  url: ${STOCK_URL:http://localhost:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
