server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 2
  port: 8083
spring:
  application:
    name: stock-service
  datasource:
    # Base unique de l'ERP, schéma et utilisateur propres à ce service (voir docker/postgres/init).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp?currentSchema=stock}
    username: ${DB_USER:stock_svc}
    password: ${DB_PASSWORD:stock_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:stock}
        hbm2ddl:
          create_namespaces: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
replenishment:
  default-lead-days: 7
  coverage-days: 30
app:
  zone: ${APP_ZONE:Indian/Antananarivo}
stock:
  expiry-alert-days: 30
