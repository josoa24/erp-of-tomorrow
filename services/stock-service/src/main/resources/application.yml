server:
  port: 8083
spring:
  application:
    name: stock-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/stock_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
replenishment:
  default-lead-days: 7
  coverage-days: 30
