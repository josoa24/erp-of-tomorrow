server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 2
  port: 8088
spring:
  application:
    name: module-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp?currentSchema=module}
    username: ${DB_USER:module_svc}
    password: ${DB_PASSWORD:module_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:module}
        hbm2ddl:
          create_namespaces: true
remote:
  vente-url: ${VENTE_URL:http://localhost:8082}
  rh-url: ${RH_URL:http://localhost:8081}
  stock-url: ${STOCK_URL:http://localhost:8083}
module:
  time-zone: ${MODULE_TIME_ZONE:Indian/Antananarivo}
management:
  endpoints:
    web:
      exposure:
        include: health,info
