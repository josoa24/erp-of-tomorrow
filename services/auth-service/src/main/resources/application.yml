server:
  port: 8084
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  ttl-minutes: ${JWT_TTL_MINUTES:480}
admin:
  email: ${ADMIN_EMAIL:admin@erp.local}
  password: ${ADMIN_PASSWORD:admin1234}
management:
  endpoints:
    web:
      exposure:
        include: health,info
