server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 2
  port: 8084
spring:
  application:
    name: auth-service
  datasource:
    # Base unique de l'ERP, schéma et utilisateur propres à ce service (voir docker/postgres/init).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp?currentSchema=auth}
    username: ${DB_USER:auth_svc}
    password: ${DB_PASSWORD:auth_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:auth}
        hbm2ddl:
          create_namespaces: true
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  ttl-minutes: ${JWT_TTL_MINUTES:480}
admin:
  email: ${ADMIN_EMAIL:admin@erp.local}
  password: ${ADMIN_PASSWORD:admin1234}
  name: ${ADMIN_NAME:Administrateur}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
